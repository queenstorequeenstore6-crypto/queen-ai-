<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعدي AI</title>
</head><body>
  <h1>🤖 مساعدي AI</h1>  <input id="question" type="text" placeholder="اكتبي سؤالك هنا">
  <button onclick="sendMessage()">إرسال</button>  <div id="chat"></div>  <script>
    function sendMessage() {
      const question = document.getElementById("question").value;
      const chat = document.getElementById("chat");

      if (question.trim() === "") return;

      chat.innerHTML += "<p>👤 أنتِ: " + question + "</p>";
      chat.innerHTML += "<p>🤖 مساعدي: مرحبًا! وصلتني رسالتك هكذا: " + question + "</p>";

      document.getElementById("question").value = "";
    }
  </script></body>
</html>
